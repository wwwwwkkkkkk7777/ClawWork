name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clawwork
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clawwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clawwork?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: clawwork
      S3_AUTO_CREATE_BUCKET: true
      OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
      JWT_ACCESS_SECRET: ci-access-secret-at-least-24-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-24-characters
      PASSWORD_PEPPER: ci-password-pepper-at-least-24-characters
      ADAPTER_INTERNAL_TOKEN: ci-adapter-token-at-least-24-characters
      FILE_PARSER_INTERNAL_TOKEN: ci-file-parser-token-at-least-24-characters
      TASK_QUEUE_ATTEMPTS: 1
      POSTGRES_PASSWORD: postgres
      REDIS_PASSWORD: redis-password
      METRICS_TOKEN: ci-metrics-token-at-least-24-characters
      CORS_ORIGINS: http://localhost:8081
      MAX_UPLOAD_BYTES: 10485760
      TASK_TIMEOUT_MS: 120000
      MAX_RESULT_FILE_BYTES: 26214400
      RESULT_ARTIFACT_ALLOWED_ORIGINS: http://127.0.0.1:18789
      STALE_UPLOAD_RETENTION_HOURS: 24
      UNREFERENCED_FILE_RETENTION_HOURS: 168
      FILE_CLEANUP_INTERVAL_MS: 900000
      RATE_LIMIT_ANONYMOUS_PER_MINUTE: 1000
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: 1000
      USER_DAILY_TASK_LIMIT: 1000
      USER_CONCURRENT_TASK_LIMIT: 10
      USER_STORAGE_BYTES: 1073741824
      EXPO_PUSH_ENABLED: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO
        run: |
          docker run -d --name clawwork-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs clawwork-ci-minio
          exit 1
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm check:open-source
      - run: pnpm check:history
      - run: pnpm check:workspace
      - run: pnpm audit:prod
      - run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.demo.yml config --quiet
      - run: docker compose -f infra/compose/docker-compose.production.yml config --quiet
      - run: docker build -f infra/docker/mobile-api.Dockerfile -t clawwork-mobile-api:ci .
      - run: docker build -f infra/docker/openclaw-adapter.Dockerfile -t clawwork-openclaw-adapter:ci .
      - run: docker build -f infra/docker/file-parser-worker.Dockerfile -t clawwork-file-parser-worker:ci .
      - run: docker build -f infra/docker/mock-gateway.Dockerfile -t clawwork-mock-gateway:ci .
      - run: pnpm lint
      - run: pnpm -r --workspace-concurrency=1 test
      - run: pnpm exec vitest run tests/smoke/backend-smoke.spec.ts
